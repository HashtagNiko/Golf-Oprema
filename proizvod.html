<section>
  <div class="wrap product">
    <div class="gallery">
      <div class="main"><img id="mainImg" src="slike/set.webp" alt="PerfectPutt set"><video id="mainVid" muted loop playsinline preload="metadata" poster="slike/video-poster.jpg" style="display:none"></video></div>

        <img class="active" src="slike/set.webp" alt="PerfectPutt set" onclick="swapMain('slike/set.webp',this)">
        <img src="slike/detajl1.webp" alt="Detalj 1" onclick="swapMain('slike/detajl1.webp',this)">
        <img src="slike/detajl2.webp" alt="Detalj 2" onclick="swapMain('slike/detajl2.webp',this)">

    <div class="p-info">
      <span class="eyebrow" data-sr="Trener za puttovanje" data-en="Putting trainer">Trener za puttovanje</span>
      <h1 data-sr="PerfectPutt trener" data-en="PerfectPutt trainer"></h1>
      <div class="p-price" data-sr="80 € / set" data-en="€80 / set"></div>
      <p class="lead" data-sr="Kompletan set za vežbu puttovanja kod kuće. Meta sa ležištem za lopticu postavlja se na kraj podloge i daje jasan cilj, dok podloga obezbeđuje ravnu, pravu liniju kotrljanja. Sjajno za zagrevanje pre meča ili svakodnevnu vežbu osećaja." data-en="A complete set for practising putting at home. The target with a ball seat sits at the end of the mat and gives a clear goal, while the mat provides a smooth, true roll. Great for pre-match warm-up or daily feel practice."></p>

      <div class="p-actions">
        <a class="btn wa" data-order="wa" target="_blank" rel="noopener" data-sr="Poruči preko WhatsApp-a" data-en="Order via WhatsApp"></a>
        <a class="btn mail" data-order="mail" data-sr="Pošalji upit e-poštom" data-en="Inquire by email"></a>
      </div>

      <div class="includes">
        <h4 data-sr="U setu" data-en="In the set"></h4>
        <ul>
          <li data-sr="PerfectPutt trening pomagalo" data-en="PerfectPutt training aid"></li>
          <li data-sr="Golf loptice" data-en="Golf balls"></li>
          <li data-sr="Puter" data-en="Putter"></li>
          <li data-sr="Veštačka trava (podloga)" data-en="Artificial turf mat"></li>
        </ul>
      </div>

      <div class="usp">
        <div class="usp-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></div>
        <div class="usp-txt">
          <h3 data-sr="Znajte da li bi loptica pala u rupu" data-en="Know if it would have dropped"></h3>
          <p data-sr="Ležište je postavljeno na tačno jedan prečnik loptice &mdash; isti prag koji odlučuje da li pravi put pada. Ako PerfectPutt zadrži lopticu, vaša linija i jačina bi pronašle rupu; ako ne zadrži, put bi promašio. Iskrena povratna informacija o svakom udarcu." data-en="The catch sits at exactly one ball-diameter in height &mdash; the same threshold that decides whether a real putt falls. If PerfectPutt holds the ball, your line and pace would have found the cup; if it doesn't, the putt would have stayed out. Honest make-or-miss feedback on every stroke."></p>
        </div>
      </div>
    </div>
